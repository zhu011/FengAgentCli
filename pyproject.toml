[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fengagentcli"
version = "0.1.0"
description = "FengAgentCli - A CLI tool for managing agents"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "zhu011" }
]
dependencies = []

[project.scripts]
fengagentcli = "fengagentcli.cli:main"

[tool.setuptools.packages.find]
include = ["fengagentcli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
